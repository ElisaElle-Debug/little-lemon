      name="theme-color"
      content="#495E57"
    />

    <meta
      name="description"
      content="Little Lemon is a family-owned Mediterranean restaurant in Chicago. Reserve a table and enjoy traditional recipes served with a modern twist."
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Little Lemon Restaurant"
    />

    <meta
      property="og:description"
      content="Reserve a table at Little Lemon, a family-owned Mediterranean restaurant in Chicago."

    <meta
      property="og:type"

      property="og:image"
      content="%PUBLIC_URL%/little-lemon-og.png.png"
    />

    <meta
      property="og:url"
      content="https://www.littlelemon.com"

    <link

    />

    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />
